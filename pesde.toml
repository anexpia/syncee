name = "anexpia/syncee"
version = "1.0.0"
description = "A data replication library for easy & flexible server to client replication."
authors = ["anexpia"]
repository = "https://github.com/anexpia/syncee"
license = "MIT"

includes = [
  "pesde.toml",
  "README.md",
  "LICENSE",
  "src/*"
]

[target]
environment = "roblox"
lib = "src/init.luau"
build_files = ["src"]

[indices]
default = "https://github.com/pesde-pkg/index"

[scripts]

[dev_dependencies]

[engines]
pesde = "^0.7.0"
lune = "^0.10.2"

[dependencies]
squish = { name = "anexpia/squish", version = "^6.0.2", target = "roblox" }
